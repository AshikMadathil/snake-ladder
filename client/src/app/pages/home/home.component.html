<div class="home">
  <div class="card box">
    <div class="logo">🐍 <span>Snake &amp; Ladder</span> 🪜</div>
    <p class="tag">Play online with friends. Up to 4 players.</p>

    <label for="name">Your name</label>
    <input id="name" #nameInput placeholder="Enter your name" maxlength="12" autocomplete="off" />

    <button class="btn primary" [disabled]="loading" (click)="create(nameInput.value)">
      Create Room
    </button>

    <div class="or"><span>or join a friend</span></div>

    <input #codeInput class="code" placeholder="ROOM CODE" maxlength="6"
           autocapitalize="characters" autocomplete="off" />
    <button class="btn secondary" [disabled]="loading" (click)="join(nameInput.value, codeInput.value)">
      Join Room
    </button>

    @if (loading) {
      <p class="info">Connecting to server… the first connection can take up to a minute.</p>
    }
    @if (error) {
      <p class="error">{{ error }}</p>
    }
  </div>
</div>
