<div class="overlay">
  @if (good) {
    @for (c of confetti; track $index) {
      <i class="confetti" [style.left.%]="c.left" [style.animation-delay.s]="c.delay" [style.background]="c.color"></i>
    }
  }
  <div class="winner">
    <div class="trophy">{{ me?.rank === 1 ? '🏆' : (good ? '🎉' : '🎮') }}</div>
    <h2>{{ title }}</h2>

    <ol class="rank">
      @for (p of standings; track p.id) {
        <li [class.me]="p.id === myId" [class.out]="!p.rank">
          <span class="m">{{ p.rank ? medal(p) : '✕' }}</span>
          <b>{{ p.name }}</b>
          @if (p.id === myId) { <small>You</small> }
          @if (p.loser) { <em>Last</em> } @else if (!p.rank) { <em>Left</em> }
        </li>
      }
    </ol>

    <button class="btn primary" (click)="home.emit()">Back to Home</button>
  </div>
</div>
